<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ankit Kumar — Backend &amp; Systems Infrastructure Engineer</title>
    <meta
      name="description"
      content="Backend and systems engineer building container deployment engines, self-hosted mail infrastructure, high-throughput media extraction services, and in-memory key-value databases."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..700&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Boot Script -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
